    function buildMissingImagePromptHtml(fileName, roleLabel) {
      return `
        <div class="w-full h-full flex flex-col items-center justify-center p-4 text-center bg-amber-50/95 border-2 border-dashed border-amber-500 rounded-xl space-y-2">
          <div class="text-2xl">🗜️</div>
          <div class="text-sm sm:text-base font-black text-rose-700">
            尚未載入 ${fileName}（${roleLabel}）
          </div>
          <p class="text-xs text-stone-600 max-w-md">
            請點擊下方按鈕上傳 <strong class="font-mono">高小找不同遊戲_12題_原圖及改動圖PNG.zip</strong>（或選取 PNG 圖片），瀏覽器將自動解壓縮並顯示原圖。
          </p>
          <button type="button" onclick="event.stopPropagation(); openZipUploadModal();"
                  class="storybook-btn bg-amber-300 hover:bg-amber-400 text-stone-950 px-3 py-1.5 rounded-xl text-xs font-black">
            📦 立即載入 ZIP / PNG
          </button>
        </div>
      `;
    }

    function handleImageLoaded(fileName) {
      relativeFailedMap.set(fileName, false);
      updateLoadedImagesSummary();
    }

    function handleImageLoadError(imgEl, fileName, roleLabel) {
      relativeFailedMap.set(fileName, true);
      updateLoadedImagesSummary();
      if (imgEl && imgEl.parentElement) {
        imgEl.parentElement.innerHTML = buildMissingImagePromptHtml(fileName, roleLabel);
      }
    }

    // 支援處理 .zip 壓縮檔（含子資料夾自動尋找 1_a.png～12_b.png）與多選 .png 圖片
    async function processUploadedFiles(fileList) {
      if (!fileList || fileList.length === 0) return 0;
      const validNames = new Set();
      for (let i = 1; i <= 12; i++) {
        validNames.add(`${i}_a.png`);
        validNames.add(`${i}_b.png`);
      }

      let matchedCount = 0;
      const summary = document.getElementById('loaded-images-summary');
      const modalStatus = document.getElementById('modal-upload-status');

      for (const file of Array.from(fileList)) {
        const lowerName = (file.name || '').toLowerCase();
        if (lowerName.endsWith('.zip')) {
          if (typeof JSZip === 'undefined') {
            if (summary) summary.textContent = '⚠️ JSZip 載入失敗，請改用「多選 PNG 圖片」上傳解壓縮後的 24 張 PNG';
            continue;
          }
          try {
            if (summary) {
              summary.textContent = `⏳ 正在解壓縮 ${file.name}，請稍候...`;
              summary.className = 'text-xs sm:text-sm font-black text-amber-800';
            }
            if (modalStatus) modalStatus.textContent = `⏳ 正在解壓縮 ${file.name}...`;

            const zip = await JSZip.loadAsync(file);
            const entries = Object.values(zip.files);
            for (const entry of entries) {
              if (entry.dir) continue;
              const baseName = entry.name.split('/').pop().split('\\').pop().toLowerCase();
              if (validNames.has(baseName)) {
                const blob = await entry.async('blob');
                const pngBlob = new Blob([blob], { type: 'image/png' });
                const oldUrl = runtimeImageMap.get(baseName);
                if (oldUrl && oldUrl.startsWith('blob:')) {
                  URL.revokeObjectURL(oldUrl);
                }
                const url = URL.createObjectURL(pngBlob);
                runtimeImageMap.set(baseName, url);
                relativeFailedMap.set(baseName, false);
                matchedCount++;
              }
            }
          } catch (err) {
            console.error('解壓縮 ZIP 失敗:', err);
            if (summary) summary.textContent = `❌ 解壓縮 ${file.name} 失敗，請確認檔案為有效 ZIP 格式`;
          }
        } else {
          const baseName = lowerName.split('/').pop().split('\\').pop();
          if (validNames.has(baseName)) {
            const oldUrl = runtimeImageMap.get(baseName);
            if (oldUrl && oldUrl.startsWith('blob:')) {
              URL.revokeObjectURL(oldUrl);
            }
            const url = URL.createObjectURL(file);
            runtimeImageMap.set(baseName, url);
            relativeFailedMap.set(baseName, false);
            matchedCount++;
          }
        }
      }

      updateLoadedImagesSummary();
      if (!document.getElementById('view-home').classList.contains('hidden')) {
        renderHomeMenu();
      } else if (state.currentLevelId) {
        const curLevel = LEVELS_DATA.find((l) => l.id === state.currentLevelId);
        if (curLevel) renderSceneImages(curLevel);
      }
      if (runtimeImageMap.size === 24) {
        closeZipUploadModal();
      }
      return matchedCount;
    }

    function updateLoadedImagesSummary() {
      const el = document.getElementById('loaded-images-summary');
      const modalStatus = document.getElementById('modal-upload-status');

      } else if (cached > 0) {
        text = `📦 已載入 ${cached} / 24 張原圖（其餘嘗試讀取 ./檔名）`;
        cls = 'text-xs sm:text-sm font-black text-sky-800';
      } else if (failedCount > 0) {
        text = '⚠️ 尚未載入原圖（請拖曳或上傳 ZIP 壓縮檔，或放在同資料夾）';
        cls = 'text-xs sm:text-sm font-black text-rose-700';
      } else {
        text = '自動讀取同資料夾 ./1_a.png～./12_b.png（線上預覽請上傳 ZIP 壓縮檔）';
        cls = 'text-xs sm:text-sm font-black text-stone-800';
      }

      if (el) {
        el.textContent = text;
        el.className = cls;
      }
      if (modalStatus) {
        modalStatus.textContent = `目前進度：已快取 ${cached} / 24 張圖片`;
      }
    }

    // 批次選取或拖曳檔案（支援 1_a.png～12_b.png 或大小寫/子資料夾路徑）
    function registerFileList(fileList) {
      if (!fileList || fileList.length === 0) return 0;
      let matchedCount = 0;
      const validNames = new Set();
      for (let i = 1; i <= 12; i++) {
        validNames.add(`${i}_a.png`);
        validNames.add(`${i}_b.png`);
      }

      Array.from(fileList).forEach((file) => {
        const baseName = (file.name || '').split('/').pop().toLowerCase();
        if (validNames.has(baseName)) {
          const url = URL.createObjectURL(file);
          runtimeImageMap.set(baseName, url);
          relativeFailedMap.set(baseName, false);
          matchedCount++;
        }
      });

      updateLoadedImagesSummary();
      if (document.getElementById('view-home').classList.contains('hidden') === false) {
        renderHomeMenu();
      } else if (state.currentLevelId) {
        const curLevel = LEVELS_DATA.find((l) => l.id === state.currentLevelId);
        if (curLevel) renderSceneImages(curLevel);
      }
      return matchedCount;
    }

    function loadPersistedState() {

        const savedCoords = localStorage.getItem(STORAGE_KEY_COORDS);

    }

    // 取得某關卡合併後的差異座標清單
    function getLevelDifferences(level) {
      const customList = state.customCoords[level.id];
      return level.differences.map((d, idx) => {
        if (customList && customList[idx]) {
          return { ...d, ...customList[idx] };
        }
        return { ...d };
      });
    }

    // =========================================================================
    // 6. 難度版：手動倒數計時器（60-180秒）與不限次數偷看原圖
    // =========================================================================
    function changeTimerDuration(val) {
      stopManualTimer();
      const clamped = Math.min(180, Math.max(60, parseInt(val, 10) || 60));
      state.timerDuration = clamped;
      state.timerRemaining = clamped;
      document.getElementById('timer-duration-label').textContent = clamped;
      updateTimerDisplay();
      document.getElementById('btn-timer-start').textContent = '▶️ 開始倒數';
    }

    function updateTimerDisplay() {
      const mins = Math.floor(state.timerRemaining / 60);
      const secs = state.timerRemaining % 60;
      document.getElementById('timer-display').textContent =
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function toggleManualTimer() {
      if (state.timerRunning) {
        stopManualTimer();
        document.getElementById('btn-timer-start').textContent = '▶️ 繼續計時';
      } else {
        if (state.timerRemaining <= 0) {
          state.timerRemaining = state.timerDuration;
        }
        state.timerRunning = true;
        document.getElementById('btn-timer-start').textContent = '⏸️ 暫停計時';
        state.timerInterval = setInterval(() => {
          state.timerRemaining--;
          updateTimerDisplay();
          if (state.timerRemaining <= 0) {
            stopManualTimer();
            playTone('alarm');
            switchToPlayPhase();
          }
        }, 1000);
      }
    }

    function stopManualTimer() {
      state.timerRunning = false;
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
    }

    function resetManualTimer() {
      stopManualTimer();
      state.timerRemaining = state.timerDuration;
      updateTimerDisplay();
      document.getElementById('btn-timer-start').textContent = '▶️ 開始倒數';
    }

      stopManualTimer();

      document.getElementById('hard-memorize-bar').classList.add('hidden');
      document.getElementById('hard-memorize-bar').classList.remove('flex');

    // =========================================================================
    // 7. 場景渲染、點擊判定、震動回饋與答案解鎖
    // =========================================================================
    function renderSceneImages(level) {
      const origBox = document.getElementById('original-canvas-box');
      const diffLayer = document.getElementById('diff-image-layer');

      origBox.innerHTML = buildImageElementHtml(level, 'a', 'w-full h-full object-contain bg-white');
      diffLayer.innerHTML = buildImageElementHtml(level, 'b', 'w-full h-full object-contain bg-white pointer-events-none');
    }

    function getRelativePercentCoords(clientX, clientY) {
      const box = document.getElementById('diff-canvas-box');
      const rect = box.getBoundingClientRect();
      const x = ((clientX - rect.left) / rect.width) * 100;
      const y = ((clientY - rect.top) / rect.height) * 100;
      return {
        x: Math.max(0, Math.min(100, x)),
        y: Math.max(0, Math.min(100, y)),
        pxX: clientX - rect.left,
        pxY: clientY - rect.top
      };
    }

    function handleDiffImageClick(event) {
      if (state.editorActive) return; // 校正模式由拖曳／點選校正處理

      const level = LEVELS_DATA.find((l) => l.id === state.currentLevelId);
      if (!level) return;

      const { x: clickX, y: clickY, pxX, pxY } = getRelativePercentCoords(event.clientX, event.clientY);
      const diffs = getLevelDifferences(level);
      const pad = 2.0;

      const hit = diffs.find((d) => (
        clickX >= d.x - pad &&
        clickX <= d.x + d.w + pad &&
        clickY >= d.y - pad &&
        clickY <= d.y + d.h + pad
      ));

      if (hit) {
        if (!state.foundDiffIds.includes(hit.id)) {
          state.foundDiffIds.push(hit.id);
          playTone('correct');
          updateFoundCounter();
          renderMarkers();
          renderDifferencesChecklist();
          showClickFeedback(`✅ 找到第 ${hit.id} 處：${hit.text}`, 'text-emerald-700');

          if (state.foundDiffIds.length === 6) {
            handleLevelWin(level);
          }
        } else {
          showClickFeedback(`👌 第 ${hit.id} 處已經圈出來囉！`, 'text-sky-700');
        }
      } else {
        // 點錯：僅作短暫視覺震動提醒，不扣分、不扣秒
        playTone('wrong');
        triggerWrongFeedback(document.getElementById('diff-canvas-box'), pxX, pxY);
      }
    }

    function triggerWrongFeedback(container, pxX, pxY) {
      container.classList.remove('animate-shake');
      void container.offsetWidth;
      container.classList.add('animate-shake');

      showClickFeedback('❌ 這裡一樣喔，再仔細看看！', 'text-rose-600');

      const ping = document.createElement('div');
      ping.className = 'wrong-ping';
      ping.style.left = `${pxX}px`;
      ping.style.top = `${pxY}px`;
      ping.innerHTML = `
        <div class="w-9 h-9 rounded-full bg-rose-500/90 border-2 border-white text-white font-black text-lg flex items-center justify-center shadow-md">
          ✕
        </div>
      `;
      container.appendChild(ping);
      setTimeout(() => ping.remove(), 700);
    }

    let feedbackTimer = null;
    function showClickFeedback(msg, colorClass) {
      const el = document.getElementById('click-feedback-msg');
      el.textContent = msg;
      el.className = `text-xs font-black h-4 ${colorClass}`;
      clearTimeout(feedbackTimer);
      feedbackTimer = setTimeout(() => {
        el.textContent = '';
      }, 2400);
    }

    function updateFoundCounter() {
      const count = state.foundDiffIds.length;
      document.getElementById('header-found-count').textContent = count;
      document.getElementById('game-found-num').textContent = count;
    }

    function renderMarkers() {
      const level = LEVELS_DATA.find((l) => l.id === state.currentLevelId);
      if (!level) return;
      const diffs = getLevelDifferences(level);
      const layer = document.getElementById('markers-layer');
      layer.innerHTML = '';

      diffs.forEach((d) => {
        if (!state.foundDiffIds.includes(d.id)) return;
        const box = document.createElement('div');
        box.className = 'absolute border-[3.5px] border-rose-500 rounded-xl shadow-[0_0_0_2px_#FFFFFF] animate-pop';
        box.style.left = `${d.x}%`;
        box.style.top = `${d.y}%`;
        box.style.width = `${d.w}%`;
        box.style.height = `${d.h}%`;

        box.innerHTML = `
          <span class="absolute -top-3 -right-3 w-6 h-6 rounded-full bg-rose-500 border-2 border-white text-white text-xs font-black flex items-center justify-center shadow">
            ${d.id}
          </span>
        `;
        layer.appendChild(box);
      });
    }

    function renderDifferencesChecklist() {
      const level = LEVELS_DATA.find((l) => l.id === state.currentLevelId);
      if (!level) return;
      const diffs = getLevelDifferences(level);
      const container = document.getElementById('differences-checklist');
      container.innerHTML = '';

      diffs.forEach((d) => {
        const isFound = state.foundDiffIds.includes(d.id);
        const item = document.createElement('div');
        item.className = `p-3 rounded-xl border-2 flex items-center gap-2.5 transition-all ${
          isFound
            ? 'bg-emerald-50 border-emerald-600 text-emerald-950 font-bold'
            : 'bg-stone-100 border-stone-300 text-stone-400'
        }`;

        item.innerHTML = `
          <span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-black shrink-0 border-2 ${
            isFound
              ? 'bg-rose-500 border-[#3D352E] text-white'
              : 'bg-white border-stone-300 text-stone-400'
          }">
            ${d.id}
          </span>
          <span class="text-xs sm:text-sm leading-snug">
            ${isFound ? d.text : '尚未發現（點擊圖片尋找）'}
          </span>
        `;
        container.appendChild(item);
      });
    }

    function revealAllAnswers() {
      const level = LEVELS_DATA.find((l) => l.id === state.currentLevelId);
      if (!level) return;
      if (level.mode === 'hard' && state.hardPhase === 'memorize') {
        switchToPlayPhase();
      }
      state.foundDiffIds = [1, 2, 3, 4, 5, 6];
      updateFoundCounter();
      renderMarkers();
      renderDifferencesChecklist();
      playTone('correct');
      showClickFeedback('💡 已顯示本題全部 6 處答案與說明！', 'text-violet-700');
    }

    function handleLevelWin(level) {
      playTone('win');
      if (!state.completedLevels.includes(level.id)) {
        state.completedLevels.push(level.id);
        saveProgress();
      }
      document.getElementById('win-banner').classList.remove('hidden');
    }

    // =========================================================================
    // 8. 單張圖片替換與「座標校正模式」（拖曳/點選調整百分比座標 + 複製 JSON）
    // =========================================================================
    function handleCustomImageUpload(event, suffix) {
      const file = event.target.files && event.target.files[0];
      const level = LEVELS_DATA.find((l) => l.id === state.currentLevelId);
      if (!file || !level) return;

      const fileName = getAssetFilename(level, suffix);
      const url = URL.createObjectURL(file);
      runtimeImageMap.set(fileName, url);
      relativeFailedMap.set(fileName, false);
      renderSceneImages(level);
      updateLoadedImagesSummary();
      showClickFeedback(`✅ 已載入 ${fileName}`, 'text-emerald-700');
      event.target.value = '';
    }

    function toggleCoordinateEditor() {
      state.editorActive = !state.editorActive;
      state.dragState = null;
      const btn = document.getElementById('btn-toggle-editor');
      const controls = document.getElementById('editor-controls');
      const overlay = document.getElementById('editor-overlay-layer');

      if (state.editorActive) {
        btn.textContent = '關閉座標校正模式';
        btn.classList.replace('bg-amber-200', 'bg-rose-400');
        controls.classList.remove('hidden');
        overlay.classList.remove('hidden');
        renderEditorControls();
        renderEditorOverlay();
        updateEditorJsonPreview();
      } else {
        btn.textContent = '開啟座標校正模式';
        btn.classList.replace('bg-rose-400', 'bg-amber-200');
        controls.classList.add('hidden');
        overlay.classList.add('hidden');
      }
    }

    function renderEditorControls() {
      const container = document.getElementById('editor-target-buttons');
      container.innerHTML = '';
      for (let i = 1; i <= 6; i++) {
        const b = document.createElement('button');
        b.className = `px-3 py-1 rounded-lg text-xs font-black border-2 border-[#3D352E] ${
          state.editorSelectedDiffId === i ? 'bg-rose-500 text-white' : 'bg-stone-100 text-stone-800'
        }`;
        b.textContent = `差異 #${i}`;
        b.onclick = () => {
          state.editorSelectedDiffId = i;
          renderEditorControls();
          renderEditorOverlay();
        };
        container.appendChild(b);
      }
    }

    function renderEditorOverlay() {
      const level = LEVELS_DATA.find((l) => l.id === state.currentLevelId);
      if (!level) return;
      const diffs = getLevelDifferences(level);
      const overlay = document.getElementById('editor-overlay-layer');
      overlay.innerHTML = '';

      diffs.forEach((d) => {
        const isSelected = d.id === state.editorSelectedDiffId;
        const box = document.createElement('div');
        box.className = `absolute border-2 flex items-center justify-center text-xs font-black cursor-move ${
          isSelected
            ? 'border-amber-300 bg-amber-300/35 text-white z-10'
            : 'border-white/80 bg-white/20 text-white'
        }`;
        box.style.left = `${d.x}%`;
        box.style.top = `${d.y}%`;
        box.style.width = `${d.w}%`;
        box.style.height = `${d.h}%`;
        box.textContent = d.id;
        overlay.appendChild(box);
      });

      // 若正在拖曳新框，顯示即時框選矩形
      if (state.dragState && state.dragState.mode === 'draw') {
        const { startX, startY, curX, curY } = state.dragState;
        const left = Math.min(startX, curX);
        const top = Math.min(startY, curY);
        const width = Math.abs(curX - startX);
        const height = Math.abs(curY - startY);

        const draft = document.createElement('div');
        draft.className = 'absolute border-2 border-dashed border-emerald-300 bg-emerald-300/25 pointer-events-none z-20';
        draft.style.left = `${left}%`;
        draft.style.top = `${top}%`;
        draft.style.width = `${width}%`;
        draft.style.height = `${height}%`;
        overlay.appendChild(draft);
      }
    }

    function beginEditorPointer(clientX, clientY) {
      if (!state.editorActive) return;
      const level = LEVELS_DATA.find((l) => l.id === state.currentLevelId);
      if (!level) return;
      const pt = getRelativePercentCoords(clientX, clientY);
      const diffs = getLevelDifferences(level);

      // 檢查是否點中現有框以進行拖曳移動；否則以拖曳／點選重設選定差異框
      const clickedBox = diffs.find((d) => (
        pt.x >= d.x && pt.x <= d.x + d.w && pt.y >= d.y && pt.y <= d.y + d.h
      ));

      if (clickedBox) {
        state.editorSelectedDiffId = clickedBox.id;
        renderEditorControls();
        state.dragState = {
          mode: 'move',
          targetId: clickedBox.id,
          offsetX: pt.x - clickedBox.x,
          offsetY: pt.y - clickedBox.y,
          w: clickedBox.w,
          h: clickedBox.h
        };
      } else {
        state.dragState = {
          mode: 'draw',
          targetId: state.editorSelectedDiffId,
          startX: pt.x,
          startY: pt.y,
          curX: pt.x,
          curY: pt.y
        };
      }
      renderEditorOverlay();
    }

    function moveEditorPointer(clientX, clientY) {
      if (!state.editorActive || !state.dragState) return;
      const pt = getRelativePercentCoords(clientX, clientY);
      const level = LEVELS_DATA.find((l) => l.id === state.currentLevelId);
      if (!level) return;

      if (state.dragState.mode === 'move') {
        const nx = Math.max(0, Math.min(100 - state.dragState.w, Math.round((pt.x - state.dragState.offsetX) * 10) / 10));
        const ny = Math.max(0, Math.min(100 - state.dragState.h, Math.round((pt.y - state.dragState.offsetY) * 10) / 10));
        commitBoxCoords(level, state.dragState.targetId, nx, ny, state.dragState.w, state.dragState.h, false);
      } else if (state.dragState.mode === 'draw') {
        state.dragState.curX = pt.x;
        state.dragState.curY = pt.y;
        renderEditorOverlay();
      }
    }

    function endEditorPointer(clientX, clientY) {
      if (!state.editorActive || !state.dragState) return;
      const level = LEVELS_DATA.find((l) => l.id === state.currentLevelId);
      if (!level) {
        state.dragState = null;
        return;
      }

      if (state.dragState.mode === 'draw') {
        const pt = clientX != null ? getRelativePercentCoords(clientX, clientY) : { x: state.dragState.curX, y: state.dragState.curY };
        const rawW = Math.abs(pt.x - state.dragState.startX);
        const rawH = Math.abs(pt.y - state.dragState.startY);
        const diffs = getLevelDifferences(level);
        const cur = diffs.find((d) => d.id === state.dragState.targetId) || { w: 12, h: 12 };

        // 若幾乎是單擊（寬高都小於 1.5%），以點擊處為中心更新位置並保留原寬高；否則採用拖曳矩形
        if (rawW < 1.5 && rawH < 1.5) {
          const nx = Math.max(0, Math.min(100 - cur.w, Math.round((pt.x - cur.w / 2) * 10) / 10));
          const ny = Math.max(0, Math.min(100 - cur.h, Math.round((pt.y - cur.h / 2) * 10) / 10));
          commitBoxCoords(level, state.dragState.targetId, nx, ny, cur.w, cur.h, true);
        } else {
          const x = Math.round(Math.min(state.dragState.startX, pt.x) * 10) / 10;
          const y = Math.round(Math.min(state.dragState.startY, pt.y) * 10) / 10;
          const w = Math.max(2, Math.round(rawW * 10) / 10);
          const h = Math.max(2, Math.round(rawH * 10) / 10);
          commitBoxCoords(level, state.dragState.targetId, x, y, w, h, true);
        }
      } else {
        updateEditorJsonPreview();
        renderMarkers();
      }

      state.dragState = null;
      renderEditorOverlay();
    }

    function commitBoxCoords(level, diffId, x, y, w, h, refreshAll) {
      const diffs = getLevelDifferences(level);
      const idx = diffs.findIndex((d) => d.id === diffId);
      if (idx === -1) return;
      diffs[idx] = { ...diffs[idx], x, y, w, h };

      state.customCoords[level.id] = diffs.map(({ id, x: bx, y: by, w: bw, h: bh }) => ({
        id, x: bx, y: by, w: bw, h: bh
      }));
      saveCustomCoords();

      if (refreshAll) {
        renderEditorOverlay();
        renderMarkers();
        updateEditorJsonPreview();
        showClickFeedback(`📐 已更新差異 #${diffId}：(${x}%, ${y}%, ${w}%, ${h}%)`, 'text-amber-800');
      } else {
        renderEditorOverlay();
      }
    }

    function updateEditorJsonPreview() {
      const level = LEVELS_DATA.find((l) => l.id === state.currentLevelId);
      if (!level) return;
      const diffs = getLevelDifferences(level).map(({ id, text, x, y, w, h }) => ({ id, text, x, y, w, h }));
      document.getElementById('editor-json-preview').textContent = JSON.stringify({
        levelId: level.id,
        title: level.title,
        images: [getAssetFilename(level, 'a'), getAssetFilename(level, 'b')],
        differences: diffs
      }, null, 2);
    }

    function copyLevelCoordinatesJSON() {
      const level = LEVELS_DATA.find((l) => l.id === state.currentLevelId);
      if (!level) return;
      const diffs = getLevelDifferences(level).map(({ id, text, x, y, w, h }) => ({ id, text, x, y, w, h }));
      const jsonText = JSON.stringify({
        levelId: level.id,
        title: level.title,
        images: [getAssetFilename(level, 'a'), getAssetFilename(level, 'b')],
        differences: diffs
      }, null, 2);

      const ta = document.createElement('textarea');
      ta.value = jsonText;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showClickFeedback('📋 已複製本關座標 JSON 至剪貼簿！', 'text-emerald-700');
      } catch (e) {
        showClickFeedback('⚠️ 無法自動複製，請手動選取下方 JSON', 'text-rose-600');
      }
      document.body.removeChild(ta);
    }

    function handleEditorMouseDown(e) {
      if (!state.editorActive) return;
      e.stopPropagation();
      beginEditorPointer(e.clientX, e.clientY);
    }
    function handleEditorMouseMove(e) {
      if (!state.editorActive || !state.dragState) return;
      moveEditorPointer(e.clientX, e.clientY);
    }
    function handleEditorMouseUp(e) {
      if (!state.editorActive || !state.dragState) return;
      endEditorPointer(e.clientX, e.clientY);
    }
    function handleEditorTouchStart(e) {
      if (!state.editorActive || !e.touches || !e.touches[0]) return;
      e.preventDefault();
      beginEditorPointer(e.touches[0].clientX, e.touches[0].clientY);
    }
    function handleEditorTouchMove(e) {
      if (!state.editorActive || !state.dragState || !e.touches || !e.touches[0]) return;
      e.preventDefault();
      moveEditorPointer(e.touches[0].clientX, e.touches[0].clientY);
    }
    function handleEditorTouchEnd(e) {
      if (!state.editorActive || !state.dragState) return;
      const t = e.changedTouches && e.changedTouches[0];
      endEditorPointer(t ? t.clientX : null, t ? t.clientY : null);
    }

    function resetLevelCustomData() {
      if (!state.currentLevelId) return;
      delete state.customCoords[state.currentLevelId];
      saveCustomCoords();
      renderMarkers();
      renderDifferencesChecklist();
      if (state.editorActive) {
        renderEditorOverlay();
        updateEditorJsonPreview();
      }
      showClickFeedback('↺ 已還原本關預設座標', 'text-sky-700');
    }
